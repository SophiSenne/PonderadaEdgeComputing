<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1570 460" role="img"
     aria-label="Diagrama da arquitetura RTOS do detector de latido: três tarefas FreeRTOS (captura, extração de features, detecção) sincronizadas por notificação de tarefa, mutex do buffer circular, fila e mutex das features. Todos os recursos compartilhados estão protegidos por mutex.">
  <title>Arquitetura RTOS — Detector de Anomalias Acústicas (v2)</title>
  <desc>
    Pipeline: Microfone I2S -&gt; tarefaCapturaAudio (prioridade alta) -&gt; Buffer Circular
    (protegido por mutexBuffer) -&gt; tarefaExtracaoFeatures (prioridade média) -&gt; filaFeatures
    -&gt; tarefaDeteccaoAnomalia (prioridade baixa) -&gt; LEDs. tarefaCapturaAudio notifica
    tarefaExtracaoFeatures via xTaskNotifyGive/ulTaskNotifyTake. tarefaExtracaoFeatures também
    escreve featuresAtuais, protegida por mutexFeatures, lida por loop(). Desde o commit
    35a1da4, indiceEscrita e indiceLeitura do buffer circular são acessados exclusivamente
    dentro de xSemaphoreTake/Give(mutexBuffer), eliminando a condição de corrida anterior.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <symbol id="lock" viewBox="0 0 24 24">
      <path d="M6 10 V7 a6 6 0 0 1 12 0 v3" fill="none" stroke="#7a5c14" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="4" y="10" width="16" height="12" rx="2.5" fill="#7a5c14"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1570" height="460" fill="#ffffff"/>

  <!-- ===== Curved notify arrow Task1 -> Task2 ===== -->
  <path d="M 325 55 C 325 15, 810 15, 810 55" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="567" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1a1a1a">
    xTaskNotifyGive() / ulTaskNotifyTake()
  </text>
  <text x="567" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555" font-style="italic">
    (notificação de tarefa — substitui um semáforo binário)
  </text>

  <!-- ===== Row A boxes ===== -->
  <!-- Mic -->
  <rect x="20" y="55" width="160" height="90" rx="8" fill="#eafaf0" stroke="#2f9e56" stroke-width="2"/>
  <text x="100" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Microfone I2S</text>
  <text x="100" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333">INMP441</text>
  <text x="100" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">16 kHz · 32 bits</text>

  <!-- Task1 -->
  <rect x="230" y="55" width="190" height="90" rx="8" fill="#eef4fc" stroke="#2b5a8c" stroke-width="2"/>
  <text x="325" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">tarefaCapturaAudio</text>
  <text x="325" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333">prioridade 3 (alta)</text>
  <text x="325" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">core 1 · loop contínuo</text>

  <!-- Buffer (agora protegido) -->
  <rect x="470" y="55" width="190" height="90" rx="8" fill="#fdf3e0" stroke="#b5851f" stroke-width="2"/>
  <use href="#lock" x="636" y="61" width="16" height="16"/>
  <text x="565" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Buffer Circular</text>
  <text x="565" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333">int16_t[4096]</text>
  <text x="565" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">protegido por mutexBuffer</text>

  <!-- Task2 -->
  <rect x="710" y="55" width="200" height="90" rx="8" fill="#eef4fc" stroke="#2b5a8c" stroke-width="2"/>
  <text x="810" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">tarefaExtracaoFeatures</text>
  <text x="810" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333">prioridade 2 (média)</text>
  <text x="810" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">RMS · centróide · MFCC</text>

  <!-- Queue -->
  <rect x="960" y="55" width="150" height="90" rx="8" fill="#fdf3e0" stroke="#b5851f" stroke-width="2"/>
  <use href="#lock" x="1088" y="61" width="16" height="16"/>
  <text x="1035" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">filaFeatures</text>
  <text x="1035" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333">xQueueCreate(4)</text>
  <text x="1035" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">struct AudioFeatures</text>

  <!-- Task3 -->
  <rect x="1160" y="55" width="180" height="90" rx="8" fill="#eef4fc" stroke="#2b5a8c" stroke-width="2"/>
  <text x="1250" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">tarefaDeteccaoAnomalia</text>
  <text x="1250" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333">prioridade 1 (baixa)</text>
  <text x="1250" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">MLP 16→32→16→2</text>

  <!-- LEDs -->
  <rect x="1390" y="55" width="160" height="90" rx="8" fill="#eafaf0" stroke="#2f9e56" stroke-width="2"/>
  <text x="1470" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">LED verm./verde</text>
  <text x="1470" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333">GPIO 25 / 26</text>
  <text x="1470" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">alerta visual</text>

  <!-- ===== Row A arrows ===== -->
  <line x1="180" y1="100" x2="230" y2="100" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="205" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1a1a1a">i2s_read()</text>

  <line x1="420" y1="100" x2="470" y2="100" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1a1a1a">inserirAmostras()</text>
  <text x="445" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#7a5c14" font-style="italic">[mutexBuffer]</text>

  <line x1="660" y1="100" x2="710" y2="100" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="685" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1a1a1a">extrairJanela()</text>
  <text x="685" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#7a5c14" font-style="italic">[mutexBuffer]</text>

  <line x1="910" y1="100" x2="960" y2="100" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="935" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1a1a1a">xQueueSend()</text>

  <line x1="1110" y1="100" x2="1160" y2="100" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1135" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1a1a1a">xQueueReceive()</text>

  <line x1="1340" y1="100" x2="1390" y2="100" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1365" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1a1a1a">digitalWrite()</text>

  <!-- ===== Vertical connector Task2 -> featuresAtuais ===== -->
  <line x1="810" y1="145" x2="810" y2="245" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="822" y="190" font-family="Arial, sans-serif" font-size="10.5" fill="#1a1a1a">xSemaphoreTake/Give</text>
  <text x="822" y="204" font-family="Arial, sans-serif" font-size="10.5" fill="#1a1a1a">(mutexFeatures)</text>

  <!-- ===== Row B boxes ===== -->
  <rect x="680" y="245" width="260" height="90" rx="8" fill="#fdf3e0" stroke="#b5851f" stroke-width="2"/>
  <use href="#lock" x="918" y="251" width="16" height="16"/>
  <text x="810" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">featuresAtuais</text>
  <text x="810" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333">variável compartilhada</text>
  <text x="810" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">protegida por mutexFeatures</text>

  <line x1="940" y1="290" x2="1010" y2="290" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="975" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1a1a1a">leitura protegida</text>

  <rect x="1010" y="245" width="260" height="90" rx="8" fill="#eef2f5" stroke="#5a6b78" stroke-width="2"/>
  <text x="1140" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">loop() Arduino</text>
  <text x="1140" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333">core 1 · prioridade idle</text>
  <text x="1140" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Serial.printf a cada 500 ms</text>

  <!-- ===== Legend ===== -->
  <rect x="40" y="385" width="22" height="16" fill="#eef4fc" stroke="#2b5a8c" stroke-width="1.5"/>
  <text x="70" y="398" font-family="Arial, sans-serif" font-size="12" fill="#1a1a1a">Tarefa FreeRTOS</text>

  <rect x="270" y="385" width="22" height="16" fill="#fdf3e0" stroke="#b5851f" stroke-width="1.5"/>
  <use href="#lock" x="278" y="386" width="11" height="11"/>
  <text x="300" y="398" font-family="Arial, sans-serif" font-size="12" fill="#1a1a1a">Recurso compartilhado protegido por mutex/fila</text>

  <rect x="700" y="385" width="22" height="16" fill="#eafaf0" stroke="#2f9e56" stroke-width="1.5"/>
  <text x="730" y="398" font-family="Arial, sans-serif" font-size="12" fill="#1a1a1a">Hardware / E-S</text>

  <!-- ===== Footer ===== -->
  <text x="785" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888888" font-style="italic">
    Detector de latido — ESP32 + INMP441 + FreeRTOS · v2, após commit 35a1da4 (mutexBuffer)
  </text>
</svg>
