<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1570 640" role="img"
     aria-label="Diagrama da arquitetura RTOS do detector de latido: três tarefas FreeRTOS (captura, extração de features, detecção) sincronizadas por notificação de tarefa, fila e mutex, com um ponto de acesso ao buffer circular sem proteção formal.">
  <title>Arquitetura RTOS — Detector de Anomalias Acústicas</title>
  <desc>
    Pipeline: Microfone I2S -&gt; tarefaCapturaAudio (prioridade alta) -&gt; Buffer Circular ->
    tarefaExtracaoFeatures (prioridade média) -&gt; filaFeatures -&gt; tarefaDeteccaoAnomalia
    (prioridade baixa) -&gt; LEDs. tarefaCapturaAudio notifica tarefaExtracaoFeatures via
    xTaskNotifyGive/ulTaskNotifyTake. tarefaExtracaoFeatures também escreve featuresAtuais,
    protegida por mutexFeatures, lida por loop(). O acesso a indiceEscrita/indiceLeitura no
    buffer circular não possui mutex, sendo um ponto de risco de concorrência.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1570" height="640" fill="#ffffff"/>

  <text x="785" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1a1a1a">
    Arquitetura RTOS — Detector de Latido (ESP32 + FreeRTOS)
  </text>

  <!-- ===== Curved notify arrow Task1 -> Task2 ===== -->
  <path d="M 325 70 C 325 15, 810 15, 810 70" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="567" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1a1a1a">
    xTaskNotifyGive() / ulTaskNotifyTake()
  </text>
  <text x="567" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555" font-style="italic">
    (notificação de tarefa — substitui um semáforo binário)
  </text>

  <!-- ===== Row A boxes ===== -->
  <!-- Mic -->
  <rect x="20" y="70" width="160" height="90" rx="8" fill="#eafaf0" stroke="#2f9e56" stroke-width="2"/>
  <text x="100" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Microfone I2S</text>
  <text x="100" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333">INMP441</text>
  <text x="100" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">16 kHz · 32 bits</text>

  <!-- Task1 -->
  <rect x="230" y="70" width="190" height="90" rx="8" fill="#eef4fc" stroke="#2b5a8c" stroke-width="2"/>
  <text x="325" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">tarefaCapturaAudio</text>
  <text x="325" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333">prioridade 3 (alta)</text>
  <text x="325" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">core 1 · loop contínuo</text>

  <!-- Buffer -->
  <rect x="470" y="70" width="190" height="90" rx="8" fill="#fdf3e0" stroke="#b5851f" stroke-width="2"/>
  <text x="565" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Buffer Circular</text>
  <text x="565" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333">int16_t[4096]</text>
  <text x="565" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">indiceEscrita / indiceLeitura</text>

  <!-- Task2 -->
  <rect x="710" y="70" width="200" height="90" rx="8" fill="#eef4fc" stroke="#2b5a8c" stroke-width="2"/>
  <text x="810" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">tarefaExtracaoFeatures</text>
  <text x="810" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333">prioridade 2 (média)</text>
  <text x="810" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">RMS · centróide · MFCC</text>

  <!-- Queue -->
  <rect x="960" y="70" width="150" height="90" rx="8" fill="#fdf3e0" stroke="#b5851f" stroke-width="2"/>
  <text x="1035" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">filaFeatures</text>
  <text x="1035" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333">xQueueCreate(4)</text>
  <text x="1035" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">struct AudioFeatures</text>

  <!-- Task3 -->
  <rect x="1160" y="70" width="180" height="90" rx="8" fill="#eef4fc" stroke="#2b5a8c" stroke-width="2"/>
  <text x="1250" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">tarefaDeteccaoAnomalia</text>
  <text x="1250" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333">prioridade 1 (baixa)</text>
  <text x="1250" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">MLP 16→32→16→2</text>

  <!-- LEDs -->
  <rect x="1390" y="70" width="160" height="90" rx="8" fill="#eafaf0" stroke="#2f9e56" stroke-width="2"/>
  <text x="1470" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">LED verm./verde</text>
  <text x="1470" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333">GPIO 25 / 26</text>
  <text x="1470" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">alerta visual</text>

  <!-- ===== Row A arrows ===== -->
  <line x1="180" y1="115" x2="230" y2="115" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="205" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1a1a1a">i2s_read()</text>

  <line x1="420" y1="115" x2="470" y2="115" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1a1a1a">inserirAmostras()</text>

  <line x1="660" y1="115" x2="710" y2="115" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="685" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1a1a1a">extrairJanela()</text>

  <line x1="910" y1="115" x2="960" y2="115" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="935" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1a1a1a">xQueueSend()</text>

  <line x1="1110" y1="115" x2="1160" y2="115" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1135" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1a1a1a">xQueueReceive()</text>

  <line x1="1340" y1="115" x2="1390" y2="115" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1365" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1a1a1a">digitalWrite()</text>

  <!-- ===== Warning callout on Buffer ===== -->
  <line x1="565" y1="160" x2="600" y2="200" stroke="#c0392b" stroke-width="1.75" stroke-dasharray="5,4" marker-end="url(#arrowRed)"/>
  <rect x="470" y="200" width="260" height="112" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.75" stroke-dasharray="5,4"/>
  <text x="600" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#a5291d">⚠ Risco de concorrência</text>
  <text x="600" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7a231a">indiceEscrita e indiceLeitura são</text>
  <text x="600" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7a231a">lidos/escritos por Task1 e Task2</text>
  <text x="600" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7a231a">sem mutex nem seção crítica</text>
  <text x="600" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#7a231a" font-style="italic">(único ponto sem sincronização formal)</text>

  <!-- ===== Vertical connector Task2 -> featuresAtuais ===== -->
  <line x1="810" y1="160" x2="810" y2="320" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="822" y="245" font-family="Arial, sans-serif" font-size="10.5" fill="#1a1a1a">xSemaphoreTake/Give</text>
  <text x="822" y="259" font-family="Arial, sans-serif" font-size="10.5" fill="#1a1a1a">(mutexFeatures)</text>

  <!-- ===== Row B boxes ===== -->
  <rect x="680" y="320" width="260" height="90" rx="8" fill="#fdf3e0" stroke="#b5851f" stroke-width="2"/>
  <text x="810" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">featuresAtuais</text>
  <text x="810" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333">variável compartilhada</text>
  <text x="810" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">protegida por mutexFeatures</text>

  <line x1="940" y1="365" x2="1010" y2="365" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="975" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1a1a1a">leitura protegida</text>

  <rect x="1010" y="320" width="260" height="90" rx="8" fill="#eef2f5" stroke="#5a6b78" stroke-width="2"/>
  <text x="1140" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">loop() Arduino</text>
  <text x="1140" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333">core 1 · prioridade idle</text>
  <text x="1140" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Serial.printf a cada 500 ms</text>

  <!-- ===== Legend ===== -->
  <rect x="40" y="450" width="22" height="16" fill="#eef4fc" stroke="#2b5a8c" stroke-width="1.5"/>
  <text x="70" y="463" font-family="Arial, sans-serif" font-size="12" fill="#1a1a1a">Tarefa FreeRTOS</text>

  <rect x="230" y="450" width="22" height="16" fill="#fdf3e0" stroke="#b5851f" stroke-width="1.5"/>
  <text x="260" y="463" font-family="Arial, sans-serif" font-size="12" fill="#1a1a1a">Recurso de sincronização (buffer / fila / variável+mutex)</text>

  <rect x="700" y="450" width="22" height="16" fill="#eafaf0" stroke="#2f9e56" stroke-width="1.5"/>
  <text x="730" y="463" font-family="Arial, sans-serif" font-size="12" fill="#1a1a1a">Hardware / E-S</text>

  <rect x="850" y="450" width="22" height="16" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="880" y="463" font-family="Arial, sans-serif" font-size="12" fill="#1a1a1a">Ponto sem proteção formal (race condition)</text>

  <!-- ===== Caption ===== -->
  <line x1="20" y1="500" x2="1550" y2="500" stroke="#dddddd" stroke-width="1"/>
  <text x="785" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#333333">
    Pipeline: Task1 (captura, prioridade 3) → Task2 (features, prioridade 2) → Task3 (detecção, prioridade 1).
  </text>
  <text x="785" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#333333">
    Sincronização por notificação de tarefa (xTaskNotify), fila (filaFeatures) e mutex (mutexFeatures);
  </text>
  <text x="785" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#333333">
    o buffer circular é o único trecho sem proteção formal entre produtor (Task1) e consumidor (Task2).
  </text>
  <text x="785" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888888" font-style="italic">
    Detector de latido — ESP32 + INMP441 + FreeRTOS
  </text>
</svg>
